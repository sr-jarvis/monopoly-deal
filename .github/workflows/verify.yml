name: Verify private game
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 scripts/generate-vector-cards.py --check
      - run: npm test
      - run: npm --workspace=client run lint
      - run: npm audit --omit=dev
      - run: docker build --build-arg APP_REVISION=${{ github.sha }} -f server/Dockerfile -t monopoly-server:check .
      # Reproduce a source archive extracted under umask077 before packaging.
      - run: find client/public -type f -exec chmod 600 {} +
      - run: docker build --build-arg APP_REVISION=${{ github.sha }} -f client/Dockerfile -t monopoly-client:check .
      - name: Verify complete nonroot runtime artwork
        run: |
          set -eu
          trap 'docker rm -f artwork-client artwork-server >/dev/null 2>&1 || true; docker network rm artwork-check >/dev/null 2>&1 || true' EXIT
          docker network create artwork-check
          docker run -d --name artwork-server --network artwork-check --network-alias server monopoly-server:check
          docker run -d --name artwork-client --network artwork-check -p 127.0.0.1:18089:8080 monopoly-client:check
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18089/revision.txt; then break; fi
            sleep 1
          done
          test "$(docker exec artwork-client id -u)" != 0
          docker exec artwork-client sh -c 'find /usr/share/nginx/html/assets -type f -exec sh -c '\''for f do test -r "$f" || exit 1; done'\'' sh {} +'
          python3 scripts/verify-artwork.py http://127.0.0.1:18089 artwork-check.json
