name: Verify private game
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm --workspace=client run lint
      - run: npm audit --omit=dev
      - run: docker build --build-arg APP_REVISION=${{ github.sha }} -f server/Dockerfile -t monopoly-server:check .
      - run: docker build --build-arg APP_REVISION=${{ github.sha }} -f client/Dockerfile -t monopoly-client:check .
